name: Regenerar y publicar Planet El Margen

on:
  schedule:
    - cron: "0 * * * *"   # cada hora, en punto (UTC)
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar el sitio
        run: python3 planet.py

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
